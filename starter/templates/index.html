<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="Easy">Easy</option>
      <option value="Medium" selected>Medium</option>
      <option value="Hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="hint-button">Hint</button>
    <button id="check-solution">Check Solution</button>
    <span id="timer">Timer: 00:00</span>
    <span id="hint-count">Hints: 0</span>
    <span id="message"></span>
  </div>

  <div id="score-panel" class="score-panel">
    <h2>Top 10 Scores</h2>
    <ul id="scoreboard-list"></ul>
    <div id="score-entry-form" class="score-entry-form" hidden>
      <label for="player-name">Player Name</label>
      <input id="player-name" type="text" maxlength="20" />
      <button id="save-score" type="button">Save Score</button>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
